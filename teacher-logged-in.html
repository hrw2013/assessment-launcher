<!DOCTYPE html> <html> <head> <title>Teacher Dashboard</title> <style> body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f0f2f5; color: #333; } .container { max-width: 900px; margin: auto; } .section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; } h1, h2 { color: #1a73e8; } input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; } .card { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 15px; margin: 10px 0; border-radius: 8px; position: relative; } button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-right: 10px; } .btn-add { background: #34a853; color: white; } .btn-save { background: #1a73e8; color: white; width: 100%; margin-top: 20px; } .btn-results { background: #fbbc05; color: #333; } .btn-delete { background: #ea4335; color: white; padding: 5px 10px; font-size: 12px; } </style> </head> <body> <div class="container"> <h1>Teacher Dashboard</h1> <div class="section"> <h2>Create New Assessment</h2> <input id="testName" placeholder="Enter Test Name (e.g., Biology Quiz 1)"> <div id="questions"></div> <button class="btn-add" onclick="addQuestion()">+ Add Question</button> <button class="btn-save" onclick="saveTest()">Upload & Distribute Test</button> </div> <div class="section"> <h2>Your Saved Assessments</h2> <div id="testList">Loading tests...</div> </div> </div> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"; import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"; import { getFirestore, collection, addDoc, getDocs, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk", authDomain: "assessment-launcher439.firebaseapp.com", projectId: "assessment-launcher439", storageBucket: "assessment-launcher439.firebasestorage.app", messagingSenderId: "654911094206", appId: "1:654911094206:web:bf85399538c256c9c2cdef" }; const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); // --- SECURE AUTH CHECK --- onAuthStateChanged(auth, (user) => { if (user) { console.log("Teacher Identity Verified:", user.email); renderTests(); } else { alert("Please log in first."); window.location.href = "teacher.html"; } }); // --- ADD QUESTION TO UI --- window.addQuestion = function() { const div = document.createElement('div'); div.className = 'card'; div.innerHTML = <input placeholder="Question Text"> <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"> <input placeholder="Option A"> <input placeholder="Option B"> <input placeholder="Option C"> <input placeholder="Option D"> </div> <input placeholder="Correct Answer (A, B, C, or D)" maxlength="1" style="width: 250px;"> ; document.getElementById('questions').appendChild(div); }; // --- SAVE TEST TO FIRESTORE --- window.saveTest = async function() { const name = document.getElementById('testName').value; const qDivs = document.querySelectorAll('#questions .card'); if (!name || qDivs.length === 0) return alert("Please fill in the name and add questions."); const questions = Array.from(qDivs).map(div => { const inputs = div.querySelectorAll('input'); return { q: inputs[0].value, a: inputs[1].value, b: inputs[2].value, c: inputs[3].value, d: inputs[4].value, correct: inputs[5].value.toUpperCase().trim() }; }); try { await addDoc(collection(db, "tests"), { testName: name, questions: questions, teacherId: auth.currentUser.uid, createdAt: serverTimestamp() }); alert("Success: Assessment is now live!"); location.reload(); } catch (e) { alert("Error: " + e.message); } }; // --- RENDER SAVED TESTS --- window.renderTests = async function() { const list = document.getElementById('testList'); try { const snap = await getDocs(collection(db, "tests")); list.innerHTML = ""; if (snap.empty) { list.innerHTML = "No tests found. Create one above!"; return; } snap.forEach(testDoc => { const data = testDoc.data(); const div = document.createElement('div'); div.className = 'card'; div.style.borderLeft = "6px solid #1a73e8"; div.innerHTML = <div style="display: flex; justify-content: space-between; align-items: center;"> <div> <strong>${data.testName}</strong><br> <small>${data.questions.length} Questions | ID: ${testDoc.id}</small> </div> <div> <button class="btn-results" onclick="window.location.href='test-results.html?id=${testDoc.id}'">View Results</button> <button class="btn-delete" onclick="deleteTest('${testDoc.id}')">Delete</button> </div> </div> ; list.appendChild(div); }); } catch (e) { list.innerHTML = "Error loading database."; } }; // --- DELETE TEST --- window.deleteTest = async function(id) { if(confirm("Are you sure? All student results for this test will be hard to find if you delete the test definition.")){ await deleteDoc(doc(db, "tests", id)); renderTests(); } }; </script> </body> </html>

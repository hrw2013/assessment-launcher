<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: auto; }
        .section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
        h1, h2 { color: #1a73e8; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .card { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 15px; margin: 10px 0; border-radius: 8px; position: relative; }
        button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-right: 10px; }
        .btn-add { background: #34a853; color: white; }
        .btn-save { background: #1a73e8; color: white; width: 100%; margin-top: 20px; }
        .btn-results { background: #fbbc05; color: #333; }
        .btn-delete { background: #ea4335; color: white; padding: 5px 10px; font-size: 12px; }
    </style>

</head>
<body>

<div class="container">

    <h1>Teacher Dashboard</h1>

   
    <!-- CREATE TEST -->
    <div class="section">
        <h2>Create Assessment</h2>

        <input id="testName" placeholder="Test Name">

        <!-- CLASS SELECT -->
        <select id="classSelect">
            <option value="">Select Class</option>
        </select>
  
<label>
    <input type="checkbox" id="lockOnOpen"> Lock test after opening (one attempt only)
</label>
       
    
        <div id="questions"></div>

        <button class="btn-add" onclick="addQuestion()">+ Add Question</button>
        <button class="btn-save" onclick="saveTest()">Save Test</button>
    </div>

    <!-- TEST LIST -->
    <div class="section">
        <h2>Saved Tests</h2>
        <div id="testList">Loading...</div>
    </div>

</div>

     <!-- CREATE CLASS (simple version) -->
    <div class="section">
        <h2>Create Class</h2>
        <input id="className" placeholder="Class Name (e.g. Biology Period 2)">
        <button class="btn-add" onclick="createClass()">Create Class</button>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { 
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔒 AUTH CHECK
onAuthStateChanged(auth, (user) => {
    if (user) {
        loadTests();
        loadClasses();
    } else {
        window.location.href = "teacher.html";
    }
});

// Student view

    window.openStudentView = function(testId) {
    window.open(`student-assessment.html?id=${testId}`, "_blank");
};

    
// 📚 CREATE CLASS
window.createClass = async function() {
    const name = document.getElementById("className").value;

    if (!name) return alert("Enter class name");

    await addDoc(collection(db, "classes"), {
        className: name,
        teacherId: auth.currentUser.uid,
        students: []
    });

    alert("Class created!");
    loadClasses();
};


// 📥 LOAD CLASSES INTO DROPDOWN
window.loadClasses = async function() {
    const snap = await getDocs(collection(db, "classes"));
    const select = document.getElementById("classSelect");

    select.innerHTML = `<option value="">Select Class</option>`;

    snap.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.data().className;
        select.appendChild(opt);
    });
};


// ➕ ADD QUESTION
window.addQuestion = function() {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
        <input placeholder="Question">
        <input placeholder="A">
        <input placeholder="B">
        <input placeholder="C">
        <input placeholder="D">
        <input placeholder="Correct (A/B/C/D)">
    `;

    document.getElementById("questions").appendChild(div);
};


// 💾 SAVE TEST (WITH CLASS)
window.saveTest = async function() {
    const name = document.getElementById("testName").value;
    const classId = document.getElementById("classSelect").value;

    const cards = document.querySelectorAll(".card");

    if (!name || !classId) return alert("Fill in all fields");

   const questions = Array.from(cards).map(c => {
    const inputs = c.querySelectorAll("input");

    return {
        q: inputs[0]?.value || "",
        a: inputs[1]?.value || "",
        b: inputs[2]?.value || "",
        c: inputs[3]?.value || "",
        d: inputs[4]?.value || "",
        correct: (inputs[5]?.value || "").toUpperCase().trim()
    };
});

   const lockOnOpen = document.getElementById("lockOnOpen").checked;

await addDoc(collection(db, "tests"), {
    testName: name,
    questions: questions,
    teacherId: auth.currentUser.uid,
    createdAt: serverTimestamp(),
    lockOnOpen: lockOnOpen
});

    alert("Test saved!");
    location.reload();
};


// 📄 LOAD TESTS
window.loadTests = async function() {
    const list = document.getElementById("testList");
    const snap = await getDocs(collection(db, "tests"));

    list.innerHTML = "";

    snap.forEach(t => {
        const d = t.data();

        const div = document.createElement("div");
        div.className = "card";

       div.innerHTML = `
    <b>${d.testName}</b><br>
    <small>Class ID: ${d.classId || "None"}</small><br><br>

    <button onclick="window.location.href='test-results.html?id=${t.id}'">
        View Results
    </button>

    <button onclick="openStudentView('${t.id}')">
        Student View
    </button>

    <button class="btn-delete" onclick="deleteTest('${t.id}')">
        Delete
    </button>
`;

        list.appendChild(div);
    });
};


// ❌ DELETE TEST
window.deleteTest = async function(id) {
    await deleteDoc(doc(db, "tests", id));
    loadTests();
};

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f0f2f5; }
        .container { max-width: 900px; margin: auto; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>

<body>

<div class="container">
    <h1>Teacher Dashboard</h1>

    <div class="section">
        <h2>Create Test</h2>
        <input id="testName" placeholder="Test Name">
        <div id="questions"></div>
        <button onclick="addQuestion()">Add Question</button>
        <button onclick="saveTest()">Save Test</button>
    </div>

    <div class="section">
        <h2>Your Tests</h2>
        <div id="testList">Loading...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs, 
    doc, 
    getDoc, 
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* =========================
   🔒 AUTH + ROLE PROTECTION
========================= */
onAuthStateChanged(auth, async (user) => {

    if (!user) {
        alert("Not logged in.");
        window.location.href = "teacher.html";
        return;
    }

    currentUser = user;

    try {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);

        if (!snap.exists()) {
            alert("No user profile found.");
            window.location.href = "teacher.html";
            return;
        }

        const data = snap.data();

        if (data.role !== "teacher") {
            alert("Access denied: Not a teacher.");
            window.location.href = "student.html";
            return;
        }

        console.log("Teacher verified:", user.email);
        renderTests();

    } catch (e) {
        alert("Permission error: " + e.message);
    }
});

/* =========================
   ➕ ADD QUESTION
========================= */
window.addQuestion = function() {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
        <input placeholder="Question"><br>
        <input placeholder="A"><br>
        <input placeholder="B"><br>
        <input placeholder="C"><br>
        <input placeholder="D"><br>
        <input placeholder="Correct (A/B/C/D)">
    `;
    document.getElementById('questions').appendChild(div);
};

/* =========================
   💾 SAVE TEST
========================= */
window.saveTest = async function() {
    const name = document.getElementById('testName').value;
    const qDivs = document.querySelectorAll('#questions .card');

    if (!name || qDivs.length === 0) {
        alert("Fill everything out.");
        return;
    }

    const questions = Array.from(qDivs).map(div => {
        const i = div.querySelectorAll('input');
        return {
            q: i[0].value,
            a: i[1].value,
            b: i[2].value,
            c: i[3].value,
            d: i[4].value,
            correct: i[5].value.toUpperCase()
        };
    });

    try {
        await addDoc(collection(db, "tests"), {
            testName: name,
            questions: questions,
            teacherId: currentUser.uid,
            createdAt: serverTimestamp()
        });

        alert("Test saved!");
        location.reload();

    } catch (e) {
        alert("Save error: " + e.message);
    }
};

/* =========================
   📋 LOAD TESTS
========================= */
async function renderTests() {
    const list = document.getElementById('testList');

    try {
        const snap = await getDocs(collection(db, "tests"));
        list.innerHTML = "";

        snap.forEach(docSnap => {
            const t = docSnap.data();

            if (t.teacherId !== currentUser.uid) return;

            list.innerHTML += `
                <div class="card">
                    <b>${t.testName}</b><br>
                    <button onclick="deleteTest('${docSnap.id}')">Delete</button>
                    <button onclick="window.location.href='test-results.html?id=${docSnap.id}'">Results</button>
                </div>
            `;
        });

    } catch (e) {
        list.innerHTML = "Error loading tests";
    }
}

/* =========================
   🗑 DELETE
========================= */
window.deleteTest = async function(id) {
    await deleteDoc(doc(db, "tests", id));
    renderTests();
};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Dashboard</title>

<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f0f2f5; color: #333; }
.container { max-width: 900px; margin: auto; }
.section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
h1, h2 { color: #1a73e8; }
input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
.card { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 15px; margin: 10px 0; border-radius: 8px; position: relative; }
button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-right: 10px; }
.btn-add { background: #34a853; color: white; }
.btn-save { background: #1a73e8; color: white; width: 100%; margin-top: 20px; }
.btn-results { background: #fbbc05; color: #333; }
.btn-delete { background: #ea4335; color: white; padding: 5px 10px; font-size: 12px; }
input[type="checkbox"] { width: auto; margin-right: 8px; }
</style>
</head>

<body>

<div class="container">

<h1>Teacher Dashboard</h1>

<!-- CREATE TEST -->

<div class="section">

<h2>Create Assessment</h2>

<input id="testName" placeholder="Test Name">

<select id="classSelect">
    <option value="">Select Class</option>
</select>

<br><br>

<label><b>Max Attempts</b></label>

<select id="attemptLimit">
    <option value="1">1 Attempt</option>
    <option value="2">2 Attempts</option>
    <option value="3" selected>3 Attempts</option>
    <option value="5">5 Attempts</option>
    <option value="999">Unlimited</option>
</select>

<h3>Strict Mode Options</h3>

<label><input type="checkbox" id="ac_tabSwitch"> Log tab switching</label><br>
<label><input type="checkbox" id="ac_fullscreen"> Force fullscreen</label><br>
<label><input type="checkbox" id="ac_copyPaste"> Detect copy/paste</label><br>
<label><input type="checkbox" id="ac_disableRightClick"> Disable right click</label><br>
<label><input type="checkbox" id="ac_focusLoss"> Track focus loss</label><br><br>

<label>Max Tab Switches Before Auto Submit</label>

<input id="ac_maxTabs" type="number" value="3" min="0" max="20">

<label>Lock Mode</label>

<select id="ac_lockMode">
    <option value="soft">Soft Lock (warn only)</option>
    <option value="strict">Strict (auto-submit)</option>
</select>

<br><br>

<div id="questions"></div>

<button class="btn-add" id="addQuestionBtn">+ Add Question</button>

<button class="btn-save" id="saveTestBtn">Save Test</button>

</div>

<!-- SAVED TESTS -->

<div class="section">

<h2>Saved Tests</h2>

<div id="testList">Loading...</div>

</div>

<!-- CLASSES -->

<div class="section">

<h2>Classes</h2>

<input id="className" placeholder="Class Name">

<button class="btn-add" id="createClassBtn">Create Class</button>

<div id="classList">Loading classes...</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
  authDomain: "assessment-launcher439.firebaseapp.com",
  projectId: "assessment-launcher439",
  storageBucket: "assessment-launcher439.firebasestorage.app",
  messagingSenderId: "654911094206",
  appId: "1:654911094206:web:bf85399538c256c9c2cdef"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

let currentUser = null;

const questionsDiv = document.getElementById("questions");

document.getElementById("addQuestionBtn").addEventListener("click", addQuestion);

document.getElementById("saveTestBtn").addEventListener("click", saveTest);

document.getElementById("createClassBtn").addEventListener("click", createClass);

// AUTH SAFE 
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "teacher.html";
            return; 
        } 
        
        currentUser = user; 
        await loadTests(); 
        await loadClasses();
    });

function addQuestion(){

    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `
        <input class="question-input" placeholder="Question">

        <input class="question-input" placeholder="Answer A">

        <input class="question-input" placeholder="Answer B">

        <input class="question-input" placeholder="Answer C">

        <input class="question-input" placeholder="Answer D">

        <input class="question-input" placeholder="Correct Answer (A/B/C/D)">

        <button class="btn-delete remove-question">Delete Question</button>
    `;

    div.querySelector(".remove-question").addEventListener("click", () => {
        div.remove();
    });

    questionsDiv.appendChild(div);

}

async function saveTest(){

    try{

        if(!currentUser){
            alert("Not logged in");
            return;
        }

        const testName = document.getElementById("testName").value.trim();

        if(testName === ""){
            alert("Enter a test name");
            return;
        }

        const cards = document.querySelectorAll("#questions .card");

        if(cards.length === 0){
            alert("Add at least one question");
            return;
        }

        const questions = [];

        cards.forEach(card => {

            const inputs = card.querySelectorAll("input");

            questions.push({
                q: inputs[0].value,
                a: inputs[1].value,
                b: inputs[2].value,
                c: inputs[3].value,
                d: inputs[4].value,
                correct: inputs[5].value.toUpperCase()
            });

        });

        await addDoc(collection(db, "tests"), {

            testName: testName,

            teacherId: currentUser.uid,

            questions: questions,

            createdAt: serverTimestamp(),

            attemptLimit: parseInt(document.getElementById("attemptLimit").value),

            antiCheatSettings: {

                tabSwitch: document.getElementById("ac_tabSwitch").checked,

                fullscreen: document.getElementById("ac_fullscreen").checked,

                copyPaste: document.getElementById("ac_copyPaste").checked,

                disableRightClick: document.getElementById("ac_disableRightClick").checked,

                focusLoss: document.getElementById("ac_focusLoss").checked,

                maxTabs: parseInt(document.getElementById("ac_maxTabs").value),

                lockMode: document.getElementById("ac_lockMode").value

            }

        });

        alert("Test saved!");

        document.getElementById("testName").value = "";

        questionsDiv.innerHTML = "";

        loadTests();

    }catch(err){

        console.error(err);

        alert("Error saving test");

    }

}

async function loadTests(){

    const list = document.getElementById("testList");

    try{

        const snap = await getDocs(collection(db, "tests"));

        list.innerHTML = "";

        if(snap.empty){

            list.innerHTML = "<p>No tests yet.</p>";

            return;

        }

        snap.forEach(test => {

            const data = test.data();

            const div = document.createElement("div");

            div.className = "card";

            div.innerHTML = `
                <b>${data.testName}</b>

                <br><br>

                <button class="btn-results" onclick="window.location.href='test-results.html?id=${test.id}'">
                    View Results
                </button>

                <button onclick="window.open('student-assessment.html?id=${test.id}','_blank')">
                    Student View
                </button>

                <button class="btn-delete" onclick="deleteTest('${test.id}')">
                    Delete
                </button>
            `;

            list.appendChild(div);

        });

    }catch(err){

        console.error(err);

        list.innerHTML = "<p>Error loading tests.</p>";

    }

}

window.deleteTest = async function(id){

    try{

        await deleteDoc(doc(db, "tests", id));

        loadTests();

    }catch(err){

        console.error(err);

        alert("Delete failed");

    }

};

async function createClass(){

    try{

        if(!currentUser){
            alert("Not logged in");
            return;
        }

        const className = document.getElementById("className").value.trim();

        if(className === ""){
            alert("Enter class name");
            return;
        }

        await addDoc(collection(db, "classes"), {

            className: className,

            teacherId: currentUser.uid,

            students: [],

            createdAt: serverTimestamp()

        });

        document.getElementById("className").value = "";

        loadClasses();

    }catch(err){

        console.error(err);

        alert("Error creating class");

    }

}

async function loadClasses(){

    const list = document.getElementById("classList");

    const select = document.getElementById("classSelect");

    try{

        const snap = await getDocs(collection(db, "classes"));

        list.innerHTML = "";

        select.innerHTML = `<option value="">Select Class</option>`;

        if(snap.empty){

            list.innerHTML = "<p>No classes yet.</p>";

            return;

        }

        snap.forEach(c => {

            const data = c.data();

            const div = document.createElement("div");

            div.className = "card";

            div.innerHTML = `
                <b>${data.className}</b>

                <br><br>

                Students: ${(data.students || []).length}
            `;

            list.appendChild(div);

            const option = document.createElement("option");

            option.value = c.id;

            option.textContent = data.className;

            select.appendChild(option);

        });

    }catch(err){

        console.error(err);

        list.innerHTML = "<p>Error loading classes.</p>";

    }

}

</script>

</body>
</html>

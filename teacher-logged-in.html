<!DOCTYPE html>
<html>
<head>
<title>Teacher Dashboard</title>

<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f0f2f5; color: #333; }
.container { max-width: 900px; margin: auto; }
.section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
h1, h2 { color: #1a73e8; }
input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
.card { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 15px; margin: 10px 0; border-radius: 8px; position: relative; }
button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-right: 10px; }
.btn-add { background: #34a853; color: white; }
.btn-save { background: #1a73e8; color: white; width: 100%; margin-top: 20px; }
.btn-results { background: #fbbc05; color: #333; }
.btn-delete { background: #ea4335; color: white; padding: 5px 10px; font-size: 12px; }
input[type="checkbox"] { width: auto; margin-right: 8px; }
</style>

</head>

<body>

<div class="container">

<h1>Teacher Dashboard</h1>

<div class="section">

<h2>Create Assessment</h2>

<input id="testName" placeholder="Test Name">

<select id="classSelect">
    <option value="">Select Class</option>
</select>

    
<br><br>
<br>
<label><b>Max Attempts</b></label>
<select id="attemptLimit">
    <option value="1">1 Attempt</option>
    <option value="2">2 Attempts</option>
    <option value="3" selected>3 Attempts</option>
    <option value="5">5 Attempts</option>
    <option value="999">Unlimited</option>
</select>
<br><br>
    
<h3>Strict Mode Options</h3>

<label><input type="checkbox" id="ac_tabSwitch"> Log tab switching</label><br>
<label><input type="checkbox" id="ac_fullscreen"> Force fullscreen</label><br>
<label><input type="checkbox" id="ac_copyPaste"> Detect copy/paste</label><br>
<label><input type="checkbox" id="ac_disableRightClick"> Disable right click</label><br>
<label><input type="checkbox" id="ac_focusLoss"> Track focus loss / auto-submit</label><br>
<label>Max Tab Switches Before Auto-Submit</label><br> 
<input id="ac_maxTabs" type="number" value="3" min="0" max="20">
<label>Lock Mode</label> <br>
<select id="ac_lockMode">
    <option value="soft">Soft Lock (warn only)</option> <br>
    <option value="strict">Strict (auto-submit)</option>
</select>
<br>
<br>
<div id="questions"></div>

<button class="btn-add" onclick="addQuestion()">+ Add Question</button>

<button class="btn-save" onclick="saveTest()">Save Test</button>

</div>

<div class="section">

<h2>Saved Tests</h2>

<div id="testList">Loading...</div>

</div>

</div>

    <h2>Classes</h2>
<div id="classList">Loading classes...</div>
    

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

// AUTH SAFE
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "teacher.html";
        return;
    }

    currentUser = user;

    loadTests();
    loadClasses();
});

    // load classes

    window.loadClasses = async function () {

    const list = document.getElementById("classList");

    const snap = await getDocs(collection(db, "classes"));

    list.innerHTML = "";

    if (snap.empty) {
        list.innerHTML = "<p>No classes yet.</p>";
        return;
    }

    snap.forEach(c => {

        const d = c.data();

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <b>${d.className}</b><br><br>

            <small>
                Students: ${(d.students || []).length}
            </small>
        `;

        list.appendChild(div);

    });

};

    // create class

window.createClass = async function () {

    const name = document.getElementById("className").value;

    if (!name) return alert("Enter class name");

    await addDoc(collection(db, "classes"), {
        className: name,
        teacherId: currentUser.uid,
        students: []
    });

    document.getElementById("className").value = "";

    loadClasses(); // 🔥 refresh immediately

};
    
// LOAD TESTS
window.loadTests = async function () {

    const list = document.getElementById("testList");

    const snap = await getDocs(collection(db, "tests"));

    list.innerHTML = "";

    snap.forEach(t => {

        const d = t.data();

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <b>${d.testName}</b><br><br>

            <button onclick="window.location.href='test-results.html?id=${t.id}'">
                View Results
            </button>

            <button onclick="openStudentView('${t.id}')">
                Student View
            </button>

            <button class="btn-delete" onclick="deleteTest('${t.id}')">
                Delete
            </button>
        `;

        list.appendChild(div);

    });

};


// ADD QUESTION
window.addQuestion = function () {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
        <input placeholder="Question">
        <input placeholder="A">
        <input placeholder="B">
        <input placeholder="C">
        <input placeholder="D">
        <input placeholder="Correct (A/B/C/D)">
    `;

    document.getElementById("questions").appendChild(div);

};


// SAVE TEST (WITH CHECKBOXES)
window.saveTest = async function () {

    if (!currentUser) return;

    const name = document.getElementById("testName").value;

    const cards = document.querySelectorAll("#questions .card");

    const questions = Array.from(cards).map(c => {

        const i = c.querySelectorAll("input");

        return {
            q: i[0]?.value || "",
            a: i[1]?.value || "",
            b: i[2]?.value || "",
            c: i[3]?.value || "",
            d: i[4]?.value || "",
            correct: (i[5]?.value || "").toUpperCase()
        };

    });

    await addDoc(collection(db, "tests"), {

        testName: name,
        questions: questions,
        teacherId: currentUser.uid,
        createdAt: serverTimestamp(),

       attemptLimit: parseInt(document.getElementById("attemptLimit").value),

        antiCheatSettings: {
    tabSwitch: document.getElementById("ac_tabSwitch").checked,
    fullscreen: document.getElementById("ac_fullscreen").checked,
    copyPaste: document.getElementById("ac_copyPaste").checked,
    disableRightClick: document.getElementById("ac_disableRightClick").checked,
    focusLoss: document.getElementById("ac_focusLoss").checked,

    maxTabs: parseInt(document.getElementById("ac_maxTabs").value || "3"),
    lockMode: document.getElementById("ac_lockMode").value
}

    alert("Saved!");

    loadTests();

};


// DELETE TEST
window.deleteTest = async function (id) {

    await deleteDoc(doc(db, "tests", id));

    loadTests();

};


// STUDENT VIEW
window.openStudentView = function (id) {

    window.open(`student-assessment.html?id=${id}`, "_blank");

};

</script>

</body>
</html>

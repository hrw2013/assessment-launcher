
<!DOCTYPE html>
<html>
<head>
<title>Student Login </title>

<style>
body { font-family: Arial; text-align:center; padding-top:50px; }
input { padding:10px; margin:5px; width:250px; }
button { padding:10px 20px; margin:5px; }
</style>

</head>

<body>


<h2>Login</h2>

<input id="loginUsername" placeholder="Username"><br>
<input id="loginPassword" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.login = async function() {
    const email = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;

    try {
      // 1. Attempt the sign in
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      
      // 2. If successful, redirect the user
      console.log("Login successful!");
      window.location.href = "https://hrw2013.github.io/assessment-launcher/student-logged-in.html";
      
    } catch (error) {
      // 3. Handle errors (wrong password, user not found, etc.)
      console.error("Login failed:", error.message);
      alert("Login failed: " + error.message);
    }
  };
</script>

</script>

</body>
</html>

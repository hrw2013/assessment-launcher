

<!-- ===================== student.html ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<style>
body { font-family: Arial; padding: 20px; }
.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
button { padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h1>Student Dashboard</h1>
<div id="dashboard"></div>

<script>
const params = new URLSearchParams(window.location.search);
const encoded = params.get('test');
const dash = document.getElementById('dashboard');

let completed = JSON.parse(localStorage.getItem('completedTests') || '[]');

if (encoded) {
  const test = JSON.parse(atob(encoded));

  const alreadyDone = completed.find(t => t.name === test.name);

  const div = document.createElement('div');
  div.className = 'card';

  if (alreadyDone) {
    div.innerHTML = `
      <strong>${test.name}</strong><br>
      Completed<br>
      Score: ${alreadyDone.score}/${alreadyDone.total}<br>
      Percentage: ${alreadyDone.percent}%
    `;
  } else {
    div.innerHTML = `
      <strong>${test.name}</strong><br>
      <button onclick="openTest()">Start Test</button>
    `;
  }

  dash.appendChild(div);
  window.currentTest = test;
}

function openTest() {
  const test = window.currentTest;
  const tab = window.open();

  tab.document.write(`
    <html>
    <head>
      <title>${test.name}</title>
      <style>
        body { font-family: Arial; padding: 20px; }
      </style>
    </head>
    <body>
      <h2>${test.name}</h2>
      <form id="form">
        ${test.questions.map((q, i) => `
          <div>
            <p>${i+1}. ${q.q}</p>
            ${['A','B','C','D'].map(letter => `
              <label>
                <input type="radio" name="q${i}" value="${letter}">
                ${q[letter.toLowerCase()]}
              </label><br>
            `).join('')}
          </div>
        `).join('')}
      </form>

      <button onclick="submitTest()">Submit</button>
      <button onclick="window.close()">Close Tab</button>

      <script>
        function submitTest() {
          let score = 0;
          const test = ${JSON.stringify({})};
          const realTest = window.opener.currentTest;

          realTest.questions.forEach((q, i) => {
            const selected = document.querySelector(`input[name=q${i}]:checked`);
            if (selected && selected.value === q.correct) score++;
          });

          const total = realTest.questions.length;
          const percent = Math.round((score / total) * 100);

          let completed = JSON.parse(localStorage.getItem('completedTests') || '[]');
          completed.push({ name: realTest.name, score, total, percent });
          localStorage.setItem('completedTests', JSON.stringify(completed));

          let scores = JSON.parse(localStorage.getItem('scores') || '[]');
          scores.push({ testName: realTest.name, score, total, percent });
          localStorage.setItem('scores', JSON.stringify(scores));

          alert('Score: ' + score + '/' + total + ' (' + percent + '%)');
          window.close();
        }
      <\/script>
    </body>
    </html>
  `);

  tab.document.close();
}
</script>

</body>
</html>



<!-- ===================== student.html (Firebase login + dashboard) ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
  authDomain: "assessment-launcher439.firebaseapp.com",
  projectId: "assessment-launcher439",
  storageBucket: "assessment-launcher439.firebasestorage.app",
  messagingSenderId: "654911094206",
  appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db=db;
window.getDocs=getDocs;
window.collection=collection;
window.addDoc=addDoc;
window.auth=auth;
window.signInWithEmailAndPassword=signInWithEmailAndPassword;
</script>

<style>
body { font-family: Arial; padding: 20px; }
.card { border:1px solid #ccc; padding:10px; margin:10px; }
button{padding:10px;}
input{margin:5px;}
</style>
</head>
<body>

<h1>Student Login</h1>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<h2>Dashboard</h2>
<div id="dash"></div>

<script type="module">
let currentUser;

window.login = async function(){
  const e=document.getElementById('email').value;
  const p=document.getElementById('pass').value;
  const res = await signInWithEmailAndPassword(auth,e,p);
  currentUser = res.user;
  loadTests();
}

async function loadTests(){
  const snap = await getDocs(collection(db,"tests"));
  const dash=document.getElementById('dash');
  dash.innerHTML="";

  snap.forEach(d=>{
    const t=d.data();
    if(!t.assigned) return;

    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <b>${t.name}</b><br>
      <button onclick='takeTest("${d.id}")'>Take Test</button>
    `;
    dash.appendChild(div);
  });
}

window.takeTest = async function(id){
  const snap = await getDocs(collection(db,"tests"));
  let test;

  snap.forEach(d=>{
    if(d.id===id) test=d.data();
  });

  const win=window.open();

  win.document.write(`
    <html><body style='font-family:Arial;padding:20px'>
    <h2>${test.name}</h2>
    <form id='f'>
      ${test.questions.map((q,i)=>`
        <div>
          <p>${i+1}. ${q.q}</p>
          ${['A','B','C','D'].map(l=>`
            <label><input type='radio' name='q${i}' value='${l}'> ${q[l.toLowerCase()]}</label><br>
          `).join('')}
        </div>
      `).join('')}
    </form>
    <button onclick='submit()'>Submit</button>
    <button onclick='window.close()'>Close</button>

    <script>
      function submit(){
        let score=0;
        const test=${JSON.stringify(test)};

        test.questions.forEach((q,i)=>{
          const sel=document.querySelector('input[name=q'+i+']:checked');
          if(sel && sel.value===q.correct) score++;
        });

        const percent=Math.round((score/test.questions.length)*100);

        window.opener.saveScore(test.name,score,test.questions.length,percent);

        alert(score+'/'+test.questions.length+' '+percent+'%');
        window.close();
      }
    <\/script>
    </body></html>
  `);

  win.document.close();
}

window.saveScore = async function(name,score,total,percent){
  await addDoc(collection(db,"scores"),{
    user: currentUser.email,
    name,
    score,
    total,
    percent,
    time: Date.now()
  });
}

</script>

</body>
</html>


<!-- ===================== student.html ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student - Take Test</title>
<style>
body { font-family: Arial; padding: 20px; }
.q { margin-bottom: 15px; }
button { padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h1 id="title"></h1>
<form id="form"></form>
<button onclick="submitTest()">Submit</button>
<button onclick="window.close()">Close Tab</button>

<script>
const params = new URLSearchParams(window.location.search);
const index = params.get('test');
const tests = JSON.parse(localStorage.getItem('tests') || '[]');
const test = tests[index];

document.getElementById('title').innerText = test.name;

const form = document.getElementById('form');

test.questions.forEach((q, i) => {
  const div = document.createElement('div');
  div.className = 'q';
  div.innerHTML = `
    <p>${i+1}. ${q.q}</p>
    ${['A','B','C','D'].map(letter => `
      <label>
        <input type="radio" name="q${i}" value="${letter}">
        ${q[letter.toLowerCase()]}
      </label><br>
    `).join('')}
  `;
  form.appendChild(div);
});

function submitTest() {
  let score = 0;

  test.questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name=q${i}]:checked`);
    if (selected && selected.value === q.correct) score++;
  });

  alert('Score: ' + score + '/' + test.questions.length);
}
</script>

</body>
</html>

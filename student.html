

<!-- ===================== student.html ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<style>
body { font-family: Arial; padding: 20px; }
.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
button { padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h1>Student Dashboard</h1>
<div id="dashboard"></div>

<script>
const params = new URLSearchParams(window.location.search);
const encoded = params.get('test');

let assigned = JSON.parse(localStorage.getItem('assignedTests') || '[]');
let completed = JSON.parse(localStorage.getItem('completedTests') || '[]');

function saveAssigned(testObj) {
  const exists = assigned.find(t => t.id === testObj.id);
  if (!exists) {
    assigned.push(testObj);
    localStorage.setItem('assignedTests', JSON.stringify(assigned));
  }
}

function renderDashboard() {
  const dash = document.getElementById('dashboard');
  dash.innerHTML = '';

  assigned.forEach(testObj => {
    const done = completed.find(c => c.id === testObj.id);

    const div = document.createElement('div');
    div.className = 'card';

    if (done) {
      div.innerHTML = `
        <strong>${testObj.test.name}</strong><br>
        Completed<br>
        Score: ${done.score}/${done.total}<br>
        Percentage: ${done.percent}%
      `;
    } else {
      div.innerHTML = `
        <strong>${testObj.test.name}</strong><br>
        <button onclick="openTest('${testObj.id}')">Start Test</button>
      `;
    }

    dash.appendChild(div);
  });
}

let currentTest = null;

function openTest(id) {
  const testObj = assigned.find(t => t.id === id);
  currentTest = testObj;

  const tab = window.open();

  tab.document.write(`
    <html>
    <head>
      <title>${testObj.test.name}</title>
      <style>body{font-family:Arial;padding:20px;}</style>
    </head>
    <body>
      <h2>${testObj.test.name}</h2>
      <form id="form">
        ${testObj.test.questions.map((q,i)=>`
          <div>
            <p>${i+1}. ${q.q}</p>
            ${['A','B','C','D'].map(l=>`
              <label><input type='radio' name='q${i}' value='${l}'> ${q[l.toLowerCase()]}</label><br>
            `).join('')}
          </div>
        `).join('')}
      </form>

      <button onclick="submitTest()">Submit</button>
      <button onclick="window.close()">Close Tab</button>

      <script>
        function submitTest(){
          let score=0;
          const test=${JSON.stringify(testObj.test)};

          test.questions.forEach((q,i)=>{
            const sel=document.querySelector('input[name=q'+i+']:checked');
            if(sel && sel.value===q.correct) score++;
          });

          const total=test.questions.length;
          const percent=Math.round((score/total)*100);

          let completed=JSON.parse(localStorage.getItem('completedTests')||'[]');
          completed.push({id:'${id}',score,total,percent});
          localStorage.setItem('completedTests',JSON.stringify(completed));

          let scores=JSON.parse(localStorage.getItem('scores')||'[]');
          scores.push({testName:test.name,score,total,percent});
          localStorage.setItem('scores',JSON.stringify(scores));

          alert(score+'/'+total+' ('+percent+'%)');
          window.close();
        }
      <\/script>
    </body>
    </html>
  `);

  tab.document.close();
}

// AUTO LOAD FROM LINK
if (encoded) {
  const test = JSON.parse(atob(encoded));
  const id = encoded;

  saveAssigned({ id, test });
}

renderDashboard();
</script>

</body>
</html>

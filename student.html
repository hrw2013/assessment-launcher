<!DOCTYPE html>
<html>
<head>
<title>Student</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
  authDomain: "assessment-launcher439.firebaseapp.com",
  projectId: "assessment-launcher439",
  storageBucket: "assessment-launcher439.firebasestorage.app",
  messagingSenderId: "654911094206",
  appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async function () {
  await signInWithEmailAndPassword(auth, email.value, pass.value);
  loadTests();
};

window.loadTests = async function () {
  const snap = await getDocs(collection(db, "tests"));
  dash.innerHTML = "";

  snap.forEach(d => {
    const t = d.data();
    if (!t.assigned) return;

    dash.innerHTML += `
      <div>
        <b>${t.name}</b>
        <button onclick="takeTest('${d.id}')">Take</button>
      </div>
    `;
  });
};

window.takeTest = function (id) {
  window.open("about:blank").document.write("Test would load here (next upgrade)");
};
</script>

</head>

<body>

<h1>Student Login</h1>

<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>

<h2>Dashboard</h2>
<div id="dash"></div>

</body>
</html>

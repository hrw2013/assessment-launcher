<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<script type="module">
// Firebase (MODULAR v10)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
  authDomain: "assessment-launcher439.firebaseapp.com",
  projectId: "assessment-launcher439",
  storageBucket: "assessment-launcher439.firebasestorage.app",
  messagingSenderId: "654911094206",
  appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.addDoc = addDoc;
window.collection = collection;
window.getDocs = getDocs;
window.doc = doc;
window.updateDoc = updateDoc;
</script>

<style>
body { font-family: Arial; margin: 20px; }
.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
input, textarea { width: 100%; margin: 5px 0; }
button { padding: 10px; margin: 5px; }
</style>
</head>
<body>

<h1>Teacher Dashboard</h1>

<input id="testName" placeholder="Test Name">
<div id="questions"></div>
<button onclick="addQ()">Add Question</button>
<button onclick="createTest()">Create & Save Test</button>

<h2>Tests</h2>
<div id="list"></div>

<script type="module">
let questions = [];

window.addQ = function() {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <input placeholder="Question">
    <input placeholder="A">
    <input placeholder="B">
    <input placeholder="C">
    <input placeholder="D">
    <input placeholder="Correct (A/B/C/D)">
  `;
  document.getElementById('questions').appendChild(div);
}

window.createTest = async function() {
  const name = document.getElementById('testName').value;
  const qDivs = document.querySelectorAll('#questions .card');

  let qs = [];
  qDivs.forEach(d => {
    const i = d.querySelectorAll('input');
    qs.push({
      q:i[0].value,a:i[1].value,b:i[2].value,c:i[3].value,d:i[4].value,correct:i[5].value
    });
  });

  const ref = await addDoc(collection(db,"tests"),{
    name,
    questions: qs,
    assigned: false,
    created: Date.now()
  });

  alert("Test created!");
  loadTests();
}

async function loadTests(){
  const snap = await getDocs(collection(db,"tests"));
  const list = document.getElementById('list');
  list.innerHTML = "";

  snap.forEach(d => {
    const data = d.data();

    const div = document.createElement('div');
    div.className='card';
    div.innerHTML = `
      <b>${data.name}</b><br>
      <button onclick="assign('${d.id}')">Assign</button>
    `;
    list.appendChild(div);
  });
}

window.assign = async function(id){
  await updateDoc(doc(db,"tests",id),{assigned:true});
  alert("Assigned!");
}

loadTests();
</script>

</body>
</html>

<!-- ===================== teacher.html ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<style>
body { font-family: Arial; margin: 20px; }
button { padding: 10px; margin: 5px; }
input { width: 100%; margin: 5px 0; }
.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
textarea { width: 100%; height: 80px; }
</style>
</head>
<body>

<h1>Teacher Dashboard</h1>

<input id="testName" placeholder="Test Name">
<div id="questions"></div>
<button onclick="addQuestion()">Add Question</button>
<button onclick="generateLink()">Generate Share Link</button>

<h2>Share Link</h2>
<textarea id="linkBox" readonly></textarea>

<h2>Student Scores</h2>
<div id="scores"></div>

<script>
function addQuestion() {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <input placeholder="Question">
    <input placeholder="Option A">
    <input placeholder="Option B">
    <input placeholder="Option C">
    <input placeholder="Option D">
    <input placeholder="Correct Answer (A/B/C/D)">
  `;
  document.getElementById('questions').appendChild(div);
}

function generateLink() {
  const name = document.getElementById('testName').value;
  const qDivs = document.querySelectorAll('#questions .card');
  const questions = [];

  qDivs.forEach(div => {
    const inputs = div.querySelectorAll('input');
    questions.push({
      q: inputs[0].value,
      a: inputs[1].value,
      b: inputs[2].value,
      c: inputs[3].value,
      d: inputs[4].value,
      correct: inputs[5].value.toUpperCase()
    });
  });

  const test = { name, questions };
  const encoded = btoa(JSON.stringify(test));

  const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
  const url = base + "student.html?test=" + encoded;

  document.getElementById('linkBox').value = url;
}

function renderScores() {
  const scores = JSON.parse(localStorage.getItem('scores') || '[]');
  const div = document.getElementById('scores');
  div.innerHTML = '';

  scores.forEach(s => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <strong>${s.testName}</strong><br>
      Score: ${s.score}/${s.total}<br>
      Percentage: ${s.percent}%
    `;
    div.appendChild(el);
  });
}

renderScores();
</script>

</body>
</html>

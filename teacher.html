<!-- ===================== teacher.html ===================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard</title>
<style>
body { font-family: Arial; margin: 20px; }
button { padding: 10px; margin: 5px; }
input { width: 100%; margin: 5px 0; }
.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
textarea { width: 100%; height: 80px; }
</style>
</head>
<body>

<h1>Teacher Dashboard</h1>

<input id="testName" placeholder="Test Name">
<div id="questions"></div>
<button onclick="addQuestion()">Add Question</button>
<button onclick="generateLink()">Generate Share Link</button>

<h2>Share Link</h2>
<textarea id="linkBox" readonly placeholder="Your link will appear here..."></textarea>

<script>
function addQuestion() {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <input placeholder="Question">
    <input placeholder="Option A">
    <input placeholder="Option B">
    <input placeholder="Option C">
    <input placeholder="Option D">
    <input placeholder="Correct Answer (A/B/C/D)">
  `;
  document.getElementById('questions').appendChild(div);
}

function generateLink() {
  const name = document.getElementById('testName').value;
  const qDivs = document.querySelectorAll('#questions .card');
  const questions = [];

  qDivs.forEach(div => {
    const inputs = div.querySelectorAll('input');
    questions.push({
      q: inputs[0].value,
      a: inputs[1].value,
      b: inputs[2].value,
      c: inputs[3].value,
      d: inputs[4].value,
      correct: inputs[5].value.toUpperCase()
    });
  });

  const test = { name, questions };
  const encoded = btoa(JSON.stringify(test));

  const url = window.location.origin + window.location.pathname.replace('teacher.html','student.html') + '?test=' + encoded;

  document.getElementById('linkBox').value = url;
}
</script>

</body>
</html>

<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<style>

.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
button { padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h1>Student Dashboard</h1>
<div id="dashboard"></div>

<script>
const params = new URLSearchParams(window.location.search);
const encoded = params.get('test');

const dash = document.getElementById('dashboard');

if (encoded) {
  const test = JSON.parse(atob(encoded));

  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <strong>${test.name}</strong><br>
    <button onclick="openTest()">Start Test</button>
  `;
  dash.appendChild(div);

  window.currentTest = test;
}

function openTest() {
  const test = window.currentTest;
  const tab = window.open();

  tab.document.write(`
    <html>
    <head>
      <title>${test.name}</title>
      <style>
        body { font-family: Arial; padding: 20px; }
      </style>
    </head>
    <body>
      <h2>${test.name}</h2>
      <form id="form">
        ${test.questions.map((q, i) => `
          <div>
            <p>${i+1}. ${q.q}</p>
            ${['A','B','C','D'].map(letter => `
              <label>
                <input type="radio" name="q${i}" value="${letter}">
                ${q[letter.toLowerCase()]}
              </label><br>
            `).join('')}
          </div>
        `).join('')}
      </form>

      <button onclick="submitTest()">Submit</button>
      <button onclick="window.close()">Close Tab</button>

      <script>
        function submitTest() {
          let score = 0;

        }
      <\/script>
    </body>
    </html>
  `);

  tab.document.close();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Teacher</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
  authDomain: "assessment-launcher439.firebaseapp.com",
  projectId: "assessment-launcher439",
  storageBucket: "assessment-launcher439.firebasestorage.app",
  messagingSenderId: "654911094206",
  appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async function () {
  const email = emailBox.value;
  const pass = passBox.value;

  await signInWithEmailAndPassword(auth, email, pass);
  loadTests();
};

window.createTest = async function () {
  const name = testName.value;

  await addDoc(collection(db, "tests"), {
    name,
    assigned: false,
    questions: []
  });

  loadTests();
};

async function loadTests() {
  const snap = await getDocs(collection(db, "tests"));
  list.innerHTML = "";

  snap.forEach(d => {
    const t = d.data();

    list.innerHTML += `
      <div>
        <b>${t.name}</b>
        <button onclick="assign('${d.id}')">Assign</button>
      </div>
    `;
  });
}

window.assign = async function (id) {
  await updateDoc(doc(db, "tests", id), {
    assigned: true
  });
  loadTests();
};
</script>
</head>

<body>
<h1>Teacher Login</h1>

<input id="emailBox" placeholder="email">
<input id="passBox" type="password" placeholder="password">
<button onclick="login()">Login</button>

<h2>Create Test</h2>
<input id="testName" placeholder="test name">
<button onclick="createTest()">Create</button>

<h2>Tests</h2>
<div id="list"></div>

</body>
</html>

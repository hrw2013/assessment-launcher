<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>

  <style> body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f4f7f6; } .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; shadow: 0 4px 10px rgba(0,0,0,0.1); } .q-block { margin-bottom: 25px; padding: 15px; border-bottom: 1px solid #eee; text-align: left; } .option { display: block; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; } .option:hover { background: #f0f7ff; border-color: #1a73e8; } input[type="radio"] { margin-right: 10px; transform: scale(1.2); } .btn-submit { background: #34a853; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; } .loading { font-style: italic; color: #666; } </style>
    </style>


</head>

<body>

<h1>Student Dashboard</h1>

<div id="testList">Loading assessments...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { 
    getFirestore, 
    collection, 
    getDocs, 
    query, 
    where 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserEmail = "";

// 🔐 AUTH
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUserEmail = user.email;
    console.log("Student:", currentUserEmail);

    loadTests();
});

// 📥 LOAD TESTS + RESULTS
async function loadTests() {
    const container = document.getElementById("testList");

    try {
        container.innerHTML = "Loading assessments...";

        const testSnap = await getDocs(collection(db, "tests"));
        const resultsSnap = await getDocs(
            query(collection(db, "results"), where("studentName", "==", currentUserEmail))
        );

        // 🔁 Convert results into lookup map
        const resultsMap = {};
        resultsSnap.forEach(doc => {
            const data = doc.data();
            resultsMap[data.testId] = data;
        });

        if (testSnap.empty) {
            container.innerHTML = "No assessments available.";
            return;
        }

        container.innerHTML = "";

        testSnap.forEach(docSnap => {
            const data = docSnap.data();
            const result = resultsMap[docSnap.id];

            const div = document.createElement("div");
            div.className = "card";

            // ✅ IF COMPLETED
            if (result) {
                div.innerHTML = `
                    <h3>${data.testName}</h3>
                    <p class="completed">
                        Completed ✅<br>
                        Score: ${result.score}/${result.total} (${result.percentage}%)
                    </p>
                `;
            } 
            // ❌ IF NOT COMPLETED
            else {
                div.innerHTML = `
                    <h3>${data.testName}</h3>
                    <p class="notdone">Not Taken ❌</p>
                    <button onclick="openTest('${docSnap.id}')">
                        Take Test
                    </button>
                `;
            }

            container.appendChild(div);
        });

    } catch (e) {
        console.error("ERROR:", e);
        container.innerHTML = "Error connecting to database.";
    }
}

// 🚀 OPEN TEST
window.openTest = function(id) {
    window.open(`student-assessment.html?id=${id}`, "_blank");
};
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Assessment</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f4f7f6; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .q-block { margin-bottom: 25px; padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .option { display: block; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
        .option:hover { background: #f0f7ff; border-color: #1a73e8; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .btn-submit { background: #34a853; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; }
        .loading { font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div id="testContent">
        <p class="loading">Loading your assessment...</p>
    </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    addDoc,
    collection,
    serverTimestamp,
    setDoc,
    query,
    where,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const testId = urlParams.get("id");

let currentTest = null;
let studentEmail = "";
let savedAnswers = {};

// =========================
// AUTH
// =========================

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "student.html";
        return;
    }

    studentEmail = user.email;

    if (!testId) {

        document.getElementById("testContent").innerHTML =
            "<h2>No test ID provided.</h2>";

        return;
    }

    await loadTest(testId);

});

// =========================
// LOAD TEST
// =========================

async function loadTest(id) {

    try {

        const testRef = doc(db, "tests", id);
        const testSnap = await getDoc(testRef);

        if (!testSnap.exists()) {

            document.getElementById("testContent").innerHTML =
                "<h2>Assessment not found.</h2>";

            return;

        }

        currentTest = testSnap.data();

        // =========================
        // ATTEMPT LIMIT SYSTEM
        // =========================

        const attemptsRef = collection(db, "results");

        const attemptQuery = query(
            attemptsRef,
            where("testId", "==", id),
            where("studentName", "==", studentEmail)
        );

        const attemptSnap = await getDocs(attemptQuery);

        const attemptCount = attemptSnap.size;

        if (currentTest.attemptLimit !== 999) {

            if (attemptCount >= currentTest.attemptLimit) {

                document.getElementById("testContent").innerHTML = `
                    <h2>Access Denied</h2>
                    <p>You have used all allowed attempts.</p>
                `;

                return;
            }

        }

        const ac = currentTest.antiCheatSettings || {};

        // =========================
        // TAB SWITCH DETECTION
        // =========================

        if (ac.tabSwitch) {

            document.addEventListener("visibilitychange", () => {

                if (document.hidden) {

                    setDoc(doc(
                        db,
                        "cheatLogs",
                        testId + "_" + studentEmail + "_tab_" + Date.now()
                    ), {
                        testId,
                        studentEmail,
                        type: "tab-switch",
                        time: serverTimestamp()
                    });

                    alert("Warning: Tab switching detected.");

                }

            });

        }

        // =========================
        // FULLSCREEN LOCK
        // =========================

        if (ac.fullscreen) {

            const goFull = () => {

                const el = document.documentElement;

                if (el.requestFullscreen) {
                    el.requestFullscreen();
                }

            };

            goFull();

            document.addEventListener("fullscreenchange", () => {

                if (!document.fullscreenElement) {
                    goFull();
                }

            });

        }

        // =========================
        // COPY PASTE BLOCK
        // =========================

        if (ac.copyPaste) {

            document.addEventListener("copy", (e) => {
                e.preventDefault();
                logCheat("copy attempt");
            });

            document.addEventListener("paste", (e) => {
                e.preventDefault();
                logCheat("paste attempt");
            });

        }

        // =========================
        // RIGHT CLICK DISABLE
        // =========================

        if (ac.disableRightClick) {

            document.addEventListener("contextmenu", (e) => {
                e.preventDefault();
            });

        }

        // =========================
        // FOCUS LOSS DETECTION
        // =========================

        let focusLoss = 0;

        if (ac.focusLoss) {

            window.addEventListener("blur", () => {

                focusLoss++;

                logCheat("focus lost");

                if (focusLoss >= 3) {

                    alert("Too many focus losses. Submitting test.");

                    submitTest();

                }

            });

        }

        // =========================
        // PAGE EXIT WARNING
        // =========================

        window.addEventListener("beforeunload", (e) => {

            e.preventDefault();
            e.returnValue = "";

        });

        // =========================
        // HARD ANTI-RETAKE CHECK
        // =========================

        const lockId = id + "_" + studentEmail;

        const resultsQuery = query(
            collection(db, "results"),
            where("testId", "==", id),
            where("studentName", "==", studentEmail)
        );

        const resultsSnap = await getDocs(resultsQuery);

        if (resultsSnap.size > 0 && currentTest.lockOnOpen === true) {

            document.getElementById("testContent").innerHTML = `
                <h2>Access Denied</h2>
                <p>You have already completed this assessment.</p>
            `;

            return;

        }

        if (currentTest.lockOnOpen === true) {

            const openedRef =
                doc(db, "openedTests", lockId);

            const openedSnap =
                await getDoc(openedRef);

            if (openedSnap.exists()) {

                document.getElementById("testContent").innerHTML = `
                    <h2>Access Denied</h2>
                    <p>This assessment can only be opened once.</p>
                `;

                return;

            }

            await setDoc(openedRef, {

                testId: id,
                studentEmail: studentEmail,
                openedAt: serverTimestamp(),
                locked: true

            });

        }

        // =========================
        // MARK IN PROGRESS
        // =========================

        await setDoc(
            doc(db, "inProgressTests", lockId),
            {
                testId: id,
                studentEmail: studentEmail,
                status: "in-progress",
                startedAt: serverTimestamp()
            }
        );

        // =========================
        // LOAD DRAFT
        // =========================

        const draftRef =
            doc(db, "testDrafts", lockId);

        const draftSnap = await getDoc(draftRef);

        if (draftSnap.exists()) {

            savedAnswers =
                draftSnap.data().answers || {};

        }

        renderTest();

        // =========================
        // RESTORE ANSWERS
        // =========================

        setTimeout(() => {

            Object.keys(savedAnswers).forEach((key) => {

                const value = savedAnswers[key];

                const input =
                    document.querySelector(
                        `input[name="${key}"][value="${value}"]`
                    );

                if (input) input.checked = true;

            });

        }, 200);

    } catch (e) {

        console.error("LOAD TEST ERROR:", e);

        document.getElementById("testContent").innerHTML =
            "<h2>Error loading assessment.</h2>";

    }

}

// =========================
// CHEAT LOGGER
// =========================

function logCheat(type) {

    setDoc(doc(
        db,
        "cheatLogs",
        testId + "_" + studentEmail + "_" + Date.now()
    ), {
        testId,
        studentEmail,
        type,
        time: serverTimestamp()
    });

}

// =========================
// RENDER TEST
// =========================

function renderTest() {

    let html = `
        <h1>${currentTest.testName}</h1>
    `;

    currentTest.questions.forEach((q, i) => {

        html += `
            <div class="q-block">

                <p>
                    <strong>${i + 1}. ${q.q}</strong>
                </p>

                <label class="option">
                    <input type="radio" name="q${i}" value="A">
                    ${q.a}
                </label>

                <label class="option">
                    <input type="radio" name="q${i}" value="B">
                    ${q.b}
                </label>

                <label class="option">
                    <input type="radio" name="q${i}" value="C">
                    ${q.c}
                </label>

                <label class="option">
                    <input type="radio" name="q${i}" value="D">
                    ${q.d}
                </label>

            </div>
        `;

    });

    html += `
        <button class="btn-submit" onclick="submitTest()">
            Finish & Submit
        </button>
    `;

    document.getElementById("testContent").innerHTML = html;

}

// =========================
// AUTO SAVE
// =========================

setInterval(async () => {

    if (!currentTest || !studentEmail) return;

    const answers = {};

    currentTest.questions.forEach((q, i) => {

        const selected =
            document.querySelector(`input[name="q${i}"]:checked`);

        if (selected) {
            answers[`q${i}`] = selected.value;
        }

    });

    try {

        await setDoc(
            doc(db, "testDrafts", testId + "_" + studentEmail),
            {
                testId: testId,
                studentEmail: studentEmail,
                answers: answers,
                updatedAt: serverTimestamp()
            }
        );

    } catch (e) {

        console.error("AUTOSAVE ERROR:", e);

    }

}, 5000);

// =========================
// SUBMIT TEST
// =========================

window.submitTest = async function () {

    const btn = document.querySelector(".btn-submit");

    if (btn) {
        btn.disabled = true;
        btn.innerText = "Submitting...";
    }

    let score = 0;

    const total = currentTest.questions.length;

    currentTest.questions.forEach((q, i) => {

        const selected =
            document.querySelector(`input[name="q${i}"]:checked`);

        if (selected && selected.value === q.correct) {
            score++;
        }

    });

    try {

        await addDoc(collection(db, "results"), {

            testId: testId,
            testName: currentTest.testName,
            studentName: studentEmail,
            score: score,
            total: total,
            percentage: Math.round((score / total) * 100),
            completedAt: serverTimestamp()

        });

        await setDoc(
            doc(db, "inProgressTests", testId + "_" + studentEmail),
            {
                testId: testId,
                studentEmail: studentEmail,
                status: "completed",
                completedAt: serverTimestamp()
            }
        );

        await setDoc(
            doc(db, "testDrafts", testId + "_" + studentEmail),
            {
                cleared: true
            }
        );

        document.getElementById("testContent").innerHTML = `
            <h2>Submitted!</h2>

            <p>
                You scored ${score} out of ${total}.
            </p>

            <button onclick="window.location.href='student-logged-in.html'">
                Return to Dashboard
            </button>
        `;

    } catch (e) {

        console.error("SUBMIT ERROR:", e);

        alert("Error submitting: " + e.message);

        if (btn) {
            btn.disabled = false;
            btn.innerText = "Finish & Submit";
        }

    }

};

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Assessment</title>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f4f7f6; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .q-block { margin-bottom: 25px; padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .option { display: block; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
        .option:hover { background: #f0f7ff; border-color: #1a73e8; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        .btn-submit { background: #34a853; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; }
        .loading { font-style: italic; color: #666; }
    </style>
</head>

<body>

<div class="container">
    <div id="testContent">
        <p class="loading">Loading your assessment...</p>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    addDoc,
    collection,
    serverTimestamp,
    setDoc,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// =========================
// FIREBASE
// =========================

const firebaseConfig = {
    apiKey: "AIzaSyDoMkENtcD1-RnLsxeWrzZGyJaOlvcRvzk",
    authDomain: "assessment-launcher439.firebaseapp.com",
    projectId: "assessment-launcher439",
    storageBucket: "assessment-launcher439.firebasestorage.app",
    messagingSenderId: "654911094206",
    appId: "1:654911094206:web:bf85399538c256c9c2cdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// =========================
// GLOBALS
// =========================

const urlParams = new URLSearchParams(window.location.search);
const testId = urlParams.get("id");

let currentTest = null;
let studentEmail = "";
let savedAnswers = {};

// =========================
// EXIT CONTROL (NEW)
// =========================

let allowExit = false;

window.addEventListener("beforeunload", (e) => {
    if (!allowExit) {
        e.preventDefault();
        e.returnValue = "";
    }
});

// =========================
// AUTH
// =========================

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "student.html";
        return;
    }

    studentEmail = user.email;

    if (!testId) {
        document.getElementById("testContent").innerHTML =
            "<h2>No test ID provided.</h2>";
        return;
    }

    await loadTest(testId);

});

// =========================
// LOAD TEST
// =========================

async function loadTest(id) {

    try {

        const testRef = doc(db, "tests", id);
        const testSnap = await getDoc(testRef);

        if (!testSnap.exists()) {

            document.getElementById("testContent").innerHTML =
                "<h2>Assessment not found.</h2>";

            return;

        }

        currentTest = testSnap.data();

        // =========================
        // ATTEMPT LIMIT
        // =========================

        const attemptQuery = query(
            collection(db, "results"),
            where("testId", "==", id),
            where("studentName", "==", studentEmail)
        );

        const attemptSnap = await getDocs(attemptQuery);

        const attemptCount = attemptSnap.size;

        if (currentTest.attemptLimit !== 999 && attemptCount >= currentTest.attemptLimit) {

            document.getElementById("testContent").innerHTML = `
                <h2>Access Denied</h2>
                <p>You have used all allowed attempts.</p>
            `;

            return;

        }

        const ac = currentTest.antiCheatSettings || {};

        // =========================
        // TAB SWITCH
        // =========================

     let tabSwitchCount = 0;
let maxTabs = ac.maxTabs ?? 3;

if (ac.tabSwitch) {

    document.addEventListener("visibilitychange", () => {

        if (document.hidden) {

            tabSwitchCount++;

            logCheat("tab-switch");

            if (tabSwitchCount >= maxTabs) {

                if (ac.lockMode === "strict") {
                    submitTest();
                } else {
                    alert("Warning: Tab switching detected.");
                }

            }

        }

    });

}

        // =========================
        // FULLSCREEN LOCK
        // =========================

      if (ac.fullscreen) {

    const goFull = async () => {

        const el = document.documentElement;

        if (el.requestFullscreen) {
            await el.requestFullscreen();
        }

    };

    goFull();

    document.addEventListener("fullscreenchange", () => {

        if (!document.fullscreenElement) {
            goFull(); // forces re-entry loop
        }

    });

}

        // =========================
        // COPY/PASTE BLOCK
        // =========================

        if (ac.copyPaste) {

            document.addEventListener("copy", (e) => {
                e.preventDefault();
                logCheat("copy");
            });

            document.addEventListener("paste", (e) => {
                e.preventDefault();
                logCheat("paste");
            });

        }

        // =========================
        // RIGHT CLICK BLOCK
        // =========================

        if (ac.disableRightClick) {

            document.addEventListener("contextmenu", (e) => {
                e.preventDefault();
            });

        }

        // =========================
        // FOCUS LOSS
        // =========================

        let focusLoss = 0;

        if (ac.focusLoss) {

            window.addEventListener("blur", () => {

                focusLoss++;
                logCheat("focus-loss");

                if (focusLoss >= 3) {
                    submitTest();
                }

            });

        }

        // =========================
        // LOCK SYSTEM
        // =========================

        const lockId = id + "_" + studentEmail;

        const previousResultsSnap = await getDocs(
            query(
                collection(db, "results"),
                where("testId", "==", id),
                where("studentName", "==", studentEmail)
            )
        );

        if (currentTest.lockOnOpen && previousResultsSnap.size > 0) {

            document.getElementById("testContent").innerHTML =
                "<h2>Already completed this assessment.</h2>";

            return;

        }

        if (currentTest.lockOnOpen) {

            const openedRef = doc(db, "openedTests", lockId);
            const openedSnap = await getDoc(openedRef);

            if (openedSnap.exists()) {

                document.getElementById("testContent").innerHTML =
                    "<h2>This test can only be opened once.</h2>";

                return;

            }

            await setDoc(openedRef, {
                testId: id,
                studentEmail,
                openedAt: serverTimestamp(),
                locked: true
            });

        }

        // =========================
        // IN PROGRESS
        // =========================

        await setDoc(
            doc(db, "inProgressTests", lockId),
            {
                testId: id,
                studentEmail,
                status: "in-progress",
                startedAt: serverTimestamp()
            }
        );

        // =========================
        // LOAD DRAFT
        // =========================

        const draftSnap = await getDoc(doc(db, "testDrafts", lockId));

        if (draftSnap.exists()) {
            savedAnswers = draftSnap.data().answers || {};
        }

        renderTest();

        setTimeout(() => {

            Object.keys(savedAnswers).forEach((key) => {

                const input = document.querySelector(
                    `input[name="${key}"][value="${savedAnswers[key]}"]`
                );

                if (input) input.checked = true;

            });

        }, 200);

    } catch (e) {

        console.error(e);

        document.getElementById("testContent").innerHTML =
            "<h2>Error loading assessment.</h2>";

    }

}

// =========================
// CHEAT LOGGER
// =========================

function logCheat(type) {

    setDoc(
        doc(db, "cheatLogs", testId + "_" + studentEmail + "_" + Date.now()),
        {
            testId,
            studentEmail,
            type,
            tabSwitches: tabSwitchCount || 0,
            time: serverTimestamp()
        }
    );

}

// =========================
// RENDER
// =========================

function renderTest() {

    let html = `<h1>${currentTest.testName}</h1>`;

    currentTest.questions.forEach((q, i) => {

        html += `
        <div class="q-block">

            <p><strong>${i + 1}. ${q.q}</strong></p>

            <label class="option"><input type="radio" name="q${i}" value="A"> ${q.a}</label>
            <label class="option"><input type="radio" name="q${i}" value="B"> ${q.b}</label>
            <label class="option"><input type="radio" name="q${i}" value="C"> ${q.c}</label>
            <label class="option"><input type="radio" name="q${i}" value="D"> ${q.d}</label>

        </div>`;
    });

    html += `
        <button class="btn-submit" onclick="submitTest()">Finish & Submit</button>
    `;

    document.getElementById("testContent").innerHTML = html;

}

// =========================
// AUTO SAVE
// =========================

setInterval(async () => {

    if (!currentTest) return;

    const answers = {};

    currentTest.questions.forEach((q, i) => {

        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected) answers[`q${i}`] = selected.value;

    });

    await setDoc(doc(db, "testDrafts", testId + "_" + studentEmail), {
        testId,
        studentEmail,
        answers,
        updatedAt: serverTimestamp()
    });

}, 5000);

// =========================
// SUBMIT
// =========================

window.submitTest = async function () {

    allowExit = true;
    document.exitFullscreen?.();

    const btn = document.querySelector(".btn-submit");
    if (btn) {
        btn.disabled = true;
        btn.innerText = "Submitting...";
    }

    let score = 0;
    const total = currentTest.questions.length;

    currentTest.questions.forEach((q, i) => {

        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && selected.value === q.correct) score++;

    });

    await addDoc(collection(db, "results"), {
        testId,
        testName: currentTest.testName,
        studentName: studentEmail,
        score,
        total,
        percentage: Math.round((score / total) * 100),
        completedAt: serverTimestamp()
    });

    await setDoc(doc(db, "inProgressTests", testId + "_" + studentEmail), {
        testId,
        studentEmail,
        status: "completed",
        completedAt: serverTimestamp()
    });

    await setDoc(doc(db, "testDrafts", testId + "_" + studentEmail), {
        cleared: true
    });

    // CLOSE WINDOW (works if opened by window.open)
    window.open('', '_self');
    window.close();

};

</script>
</body>
</html>
